
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | REUNLY</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <a href="index.html" class="logo">REUNLY<span>.</span></a>

        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="browse.html">Browse Items</a>
            <a href="report.html">Report Item</a>
            <a href="how-it-works.html">How It Works</a>
        </nav>

        <div class="nav-actions">
            <a href="login.html" class="login-link active">Log In</a>
            <a href="register.html" class="nav-button">Sign Up</a>
        </div>
    </header>

    <main class="auth-page">
        <section class="auth-card">

            <div class="auth-brand-mark">R<span>.</span></div>

            <span class="eyebrow">SECURE YOUR ACCOUNT</span>

            <h1>Create a new <span>password.</span></h1>

            <p class="auth-description">
                Choose a strong new password for your REUNLY account.
            </p>

            <form id="reset-password-form">

                <div class="form-group">
                    <label for="password">New password</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter new password"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirm password</label>

                    <input
                        type="password"
                        id="confirm-password"
                        placeholder="Confirm new password"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >
                </div>

                <p id="reset-message"
                   class="form-message"
                   role="status"
                   aria-live="polite"></p>

                <button type="submit"
                        id="reset-button"
                        class="submit-button">
                    Update Password →
                </button>

            </form>

            <p class="auth-switch">
                Remembered your password?
                <a href="login.html">Log in</a>
            </p>

            <a href="index.html" class="back-home">← Back to home</a>

        </section>
    </main>

    <footer class="auth-footer">
        © 2026 REUNLY. Lost something? Let's reunite.
    </footer>

    <script src="reset-password.js"></script>
</body>
</html>
