
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | REUNLY</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <a href="index.html" class="logo">REUNLY<span>.</span></a>

        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="browse.html">Browse Items</a>
            <a href="report.html">Report Item</a>
            <a href="how-it-works.html">How It Works</a>
        </nav>

        <div class="nav-actions">
            <a href="login.html" class="login-link">Log In</a>
        </div>
    </header>

    <main class="auth-page">
        <section class="auth-card">

            <div class="auth-brand-mark">R<span>.</span></div>

            <span class="eyebrow">JOIN THE COMMUNITY</span>
            <h1>Create your <span>account.</span></h1>

            <p class="auth-description">
                Become part of a campus community that helps belongings find their way home.
            </p>

            <form id="register-form">

                <div class="form-group">
                    <label for="full-name">Full name</label>
                    <input
                        type="text"
                        id="full-name"
                        name="full_name"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        maxlength="100"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="student-id">Student ID</label>
                    <input
                        type="text"
                        id="student-id"
                        name="student_id"
                        placeholder="Enter your student ID"
                        maxlength="50"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="department">Department</label>
                    <input
                        type="text"
                        id="department"
                        name="department"
                        placeholder="e.g. Computer Science"
                        maxlength="100"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="academic-year">Academic year</label>
                    <select id="academic-year" name="academic_year" required>
                        <option value="">Select your academic year</option>
                        <option value="1st Year">1st Year</option>
                        <option value="2nd Year">2nd Year</option>
                        <option value="3rd Year">3rd Year</option>
                        <option value="4th Year">4th Year</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="phone-number">Phone number</label>
                    <input
                        type="tel"
                        id="phone-number"
                        name="phone_number"
                        placeholder="Enter your phone number"
                        autocomplete="tel"
                        maxlength="15"
                        pattern="[+]?[0-9\s()-]{10,15}"
                        title="Enter a valid phone number"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="register-email">University email</label>
                    <input
                        type="email"
                        id="register-email"
                        name="email"
                        placeholder="you@university.edu"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="register-password">Password</label>
                    <input
                        type="password"
                        id="register-password"
                        name="password"
                        placeholder="At least 8 characters"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirm password</label>
                    <input
                        type="password"
                        id="confirm-password"
                        name="confirm_password"
                        placeholder="Enter your password again"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <p id="register-message" class="form-message" role="status"></p>

                <button type="submit" id="register-button" class="submit-button">
                    Create Account →
                </button>

            </form>

            <p class="auth-switch">
                Already have an account?
                <a href="login.html">Log in</a>
            </p>

            <a href="index.html" class="back-home">← Back to home</a>

        </section>
    </main>

    <footer class="auth-footer">
        © 2026 REUNLY. Lost something? Let's reunite.
    </footer>

    <script src="register.js"></script>
</body>
</html>
